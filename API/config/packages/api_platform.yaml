api_platform:
    title: Hello API Platform
    version: 1.0.0
    formats:
        jsonld: ['application/ld+json']
        multipart: ['multipart/form-data']
    docs_formats:
        jsonld: ['application/ld+json']
        multipart: ['multipart/form-data']
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    swagger:
        api_keys:
            JWT:
                name: Authorization
                type: header
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
        extra_properties:
            standard_put: true
            rfc_7807_compliant_errors: true
    # event_listeners_backward_compatibility_layer: false
    # keep_legacy_inflector: false
    collection:
        pagination:
            enabled: true
            items_per_page_parameter_name: 'itemsPerPage'  # Allow users to set custom items per page via URL
            page_parameter_name: 'page'  # Parameter for setting the page number
            partial_parameter_name: 'partial'  # Enables partial pagination for large collections